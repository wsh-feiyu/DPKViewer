name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            vs_platform: x86
          - platform: x64
            vs_platform: x64

    steps:
      - uses: actions/checkout@v5

      # windows-latest 预装 VS Enterprise，但 MFC 组件不一定装
      # 先用 vswhere 找一个已装 MFC 的 VS；没有就 winget 给最新 VS 补上
      - name: Ensure MFC + Locate MSBuild
        id: locate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          # 先找已带 MFC 的 VS（最新优先）
          $msbuild = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC `
            -find "MSBuild\**\Bin\MSBuild.exe" 2>$null | Select-Object -First 1

          if (-not $msbuild) {
            Write-Host "MFC not installed, adding via winget..."
            # 取出最新 VS 的安装目录和实例 ID
            $latestPath = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
            $latestId   = & $vswhere -latest -products * -property instanceId   | Select-Object -First 1
            Write-Host "Target VS: $latestPath (instance=$latestId)"

            # 用 winget modify 加 MFC
            winget modify --id Microsoft.VisualStudio.2022.BuildTools `
              --silent --accept-package-agreements --accept-source-agreements `
              --override "--quiet --norestart --add Microsoft.VisualStudio.Component.VC.ATLMFC --passive --wait" 2>$null | Out-Null
            # winget modify 可能因为 VS 是 Enterprise 而非 BuildTools 而失败，兜底用 setup.exe
            if ($LASTEXITCODE -ne 0) {
              $setup = Join-Path $latestPath "Common7\Tools\..\..\..\..\setup.exe"
              if (-not (Test-Path $setup)) {
                $installer = & $vswhere -latest -products * -property installerPath
                $setup = Join-Path $installer "setup.exe"
              }
              Write-Host "Fallback setup: $setup"
              & $setup modify --quiet --norestart `
                --add Microsoft.VisualStudio.Component.VC.ATLMFC `
                --wait 2>&1 | Out-Null
            }

            # 重新找已装 MFC 的 MSBuild
            $msbuild = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATLMFC `
              -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          }

          if (-not $msbuild) { throw "MFC MSBuild not found after install attempt" }
          Write-Host "MSBuild at: $msbuild"
          "msbuild=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build ${{ matrix.platform }} Release
        shell: pwsh
        run: |
          & "${{ steps.locate.outputs.msbuild }}" DPKViewer.sln `
            /t:Build /p:Configuration=Release `
            /p:Platform=${{ matrix.vs_platform }} `
            /p:DeployOnBuild=false /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed" }

      - name: Collect artifact
        shell: pwsh
        run: |
          $src = "build\${{ matrix.platform }}\Release\DPKViewer.exe"
          if (-not (Test-Path $src)) {
            Get-ChildItem -Recurse build -Filter *.exe -ErrorAction SilentlyContinue
            throw "未找到 $src"
          }
          Copy-Item $src "DPKViewer-${{ matrix.platform }}.exe" -Force
          Get-Item "DPKViewer-${{ matrix.platform }}.exe" | Select-Object Name, Length

      - name: Upload ${{ matrix.platform }} exe
        uses: actions/upload-artifact@v5
        with:
          name: DPKViewer-${{ matrix.platform }}
          path: DPKViewer-${{ matrix.platform }}.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DPKViewer ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            vs_platform: x86
          - platform: x64
            vs_platform: x64

    steps:
      - uses: actions/checkout@v5

      # windows-latest 预装的是 VS Build Tools，但 MFC 组件默认不带
      # 用 vs_installer 静默装 MFC（v143 最新 + 对应架构）
      - name: Install MFC component
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installer = & $vswhere -latest -products * -property installerPath
          $installExe = Join-Path $installer "setup.exe"
          Write-Host "Installer: $installExe"
          & $installExe modify --quiet --norestart `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre `
            --add Microsoft.VisualStudio.Component.Windows11SDK.26100 `
            --wait | Out-Null
          Write-Host "MFC install done"

      - name: Locate MSBuild
        id: locate
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          Write-Host "MSBuild at: $path"
          "msbuild=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build ${{ matrix.platform }} Release
        shell: pwsh
        run: |
          & "${{ steps.locate.outputs.msbuild }}" DPKViewer.sln `
            /t:Build /p:Configuration=Release `
            /p:Platform=${{ matrix.vs_platform }} `
            /p:DeployOnBuild=false /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed" }

      - name: Collect artifact
        shell: pwsh
        run: |
          $src = "build\${{ matrix.platform }}\Release\DPKViewer.exe"
          if (-not (Test-Path $src)) {
            Get-ChildItem -Recurse build -Filter *.exe -ErrorAction SilentlyContinue
            throw "未找到 $src"
          }
          Copy-Item $src "DPKViewer-${{ matrix.platform }}.exe" -Force
          Get-Item "DPKViewer-${{ matrix.platform }}.exe" | Select-Object Name, Length

      - name: Upload ${{ matrix.platform }} exe
        uses: actions/upload-artifact@v5
        with:
          name: DPKViewer-${{ matrix.platform }}
          path: DPKViewer-${{ matrix.platform }}.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DPKViewer ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*

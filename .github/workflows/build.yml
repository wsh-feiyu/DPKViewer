name: Build & Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.out_platform }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # solution 层 Platform 是 x86/x64，vcxproj 层 $(Platform) 解析成 Win32/x64
          # 所以 MSBuild 参数 vs_platform=x86，产物目录 out_platform=Win32
          - vs_platform: x86
            out_platform: Win32
          - vs_platform: x64
            out_platform: x64

    steps:
      - uses: actions/checkout@v5

      # windows-2022 预装 VS 2022 + MFC，直接 setup-msbuild 拿路径
      - uses: microsoft/setup-msbuild@v2

      - name: Verify MFC installed
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $path = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.ATLMFC `
            -property installationPath
          if (-not $path) { throw "MFC 组件未安装" }
          Write-Host "MFC OK at: $path"

      - name: Build Release ${{ matrix.vs_platform }}
        shell: pwsh
        run: |
          msbuild DPKViewer.sln `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.vs_platform }} `
            /m /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed" }

      # OutDir 在 vcxproj 里是 build\$(Platform)\Release\，
      # $(Platform) 在 vcxproj 层解析成 Win32/x64
      - name: Collect artifact
        shell: pwsh
        run: |
          $src = "build\${{ matrix.out_platform }}\Release\DPKViewer.exe"
          if (-not (Test-Path $src)) { throw "未找到 $src" }
          Copy-Item $src "DPKViewer-${{ matrix.out_platform }}.exe" -Force
          Get-Item "DPKViewer-${{ matrix.out_platform }}.exe" | Select-Object Name, Length

      - name: Upload ${{ matrix.out_platform }}
        uses: actions/upload-artifact@v5
        with:
          name: DPKViewer-${{ matrix.out_platform }}
          path: DPKViewer-${{ matrix.out_platform }}.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DPKViewer ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*

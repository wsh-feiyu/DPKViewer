name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86
            vs_platform: x86
          - platform: x64
            vs_platform: x64

    steps:
      - uses: actions/checkout@v5

      # ========== 关键：windows-latest 自带 VS Enterprise 但默认不带 MFC ==========
      # setup.exe 路径用 vswhere 拿 installationPath 再拼 ..\..\Installer\setup.exe
      # 如果 vswhere -property installerPath 挂，直接从已知安装路径倒推
      - name: Install MFC component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          # 1. 拿最新 VS 的 installationPath
          $instPath = & $vswhere -latest -products * -property installationPath | Select-Object -First 1
          Write-Host "Latest VS installationPath: $instPath"

          # 2. 拼 setup.exe（常见两种位置）
          $setupCandidates = @(
            (Join-Path $instPath "..\..\Installer\setup.exe"),  # VS 15/17/18 通用
            (Join-Path $instPath "Common7\IDE\devenv.exe"),     # 验证 instPath 是否有效
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          )
          $setup = $null
          foreach ($c in $setupCandidates) {
            $norm = [System.IO.Path]::GetFullPath($c)
            if (Test-Path $norm) { $setup = $norm; break }
          }
          if (-not $setup) { throw "setup.exe 未找到，候选：$($setupCandidates -join ', ')" }
          Write-Host "Using setup: $setup"

          # 3. modify 加 MFC 组件（v170/180 工具链兼容）
          & $setup modify --quiet --norestart `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC `
            --add Microsoft.VisualStudio.Component.VC.ATLMFC.Spectre `
            --wait
          if ($LASTEXITCODE -ne 0) { throw "setup modify failed (exit=$LASTEXITCODE)" }
          Write-Host "MFC installed OK"

      - name: Locate MSBuild
        id: locate
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # 必须 -requires ATLMFC 确认它装好了
          $msbuild = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.ATLMFC `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "没找到带 MFC 的 MSBuild" }
          Write-Host "MSBuild: $msbuild"
          "msbuild=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Build ${{ matrix.platform }} Release
        shell: pwsh
        run: |
          & "${{ steps.locate.outputs.msbuild }}" DPKViewer.sln `
            /t:Build /p:Configuration=Release `
            /p:Platform=${{ matrix.vs_platform }} `
            /p:DeployOnBuild=false /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed" }

      - name: Collect artifact
        shell: pwsh
        run: |
          $src = "build\${{ matrix.platform }}\Release\DPKViewer.exe"
          if (-not (Test-Path $src)) {
            Get-ChildItem -Recurse build -Filter *.exe -ErrorAction SilentlyContinue
            throw "未找到 $src"
          }
          Copy-Item $src "DPKViewer-${{ matrix.platform }}.exe" -Force
          Get-Item "DPKViewer-${{ matrix.platform }}.exe" | Select-Object Name, Length

      - name: Upload ${{ matrix.platform }} exe
        uses: actions/upload-artifact@v5
        with:
          name: DPKViewer-${{ matrix.platform }}
          path: DPKViewer-${{ matrix.platform }}.exe
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: ls -lh artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DPKViewer ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
